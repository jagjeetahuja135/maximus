<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maximus Studio | Your bag</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
    :root { --ink:#20201d; --muted:#6c6a63; --paper:#f5f1e9; --cream:#ebe4d6; --coral:#df674f; --line:rgba(32,32,29,.16); --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',Arial,sans-serif; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:var(--sans); } a { color:inherit; text-decoration:none; }
    .announcement { padding:10px 24px; background:var(--ink); color:var(--paper); text-align:center; font-size:11px; letter-spacing:.16em; text-transform:uppercase; } header { border-bottom:1px solid var(--line); } .nav { max-width:1240px; margin:auto; padding:23px 32px; display:flex; justify-content:space-between; align-items:center; } .logo { font-size:22px; font-weight:700; letter-spacing:-.06em; } .logo span { color:var(--coral); } .nav-links { display:flex; gap:30px; color:var(--muted); font-size:13px; } .nav-links a:hover { color:var(--coral); }
    .cart-shell { max-width:1240px; margin:auto; padding:78px 32px 110px; } .eyebrow { color:var(--coral); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; } h1 { font:500 clamp(50px,7vw,82px)/.9 var(--serif); letter-spacing:-.07em; margin:15px 0 55px; } .cart-layout { display:grid; grid-template-columns:1.5fr .7fr; gap:65px; align-items:start; }
    .cart-items-heading { display:grid; grid-template-columns:1fr 145px 95px; border-bottom:1px solid var(--ink); padding:0 0 13px; color:var(--muted); font-size:11px; letter-spacing:.1em; text-transform:uppercase; } .cart-item { display:grid; grid-template-columns:90px 1fr 145px 95px; gap:17px; align-items:center; padding:20px 0; border-bottom:1px solid var(--line); } .cart-item img { width:90px; height:116px; object-fit:cover; background:var(--cream); } .cart-item-info h3 { margin:0 0 6px; font:500 20px var(--serif); } .cart-item-info p { margin:0 0 14px; color:var(--muted); font-size:12px; } .remove-item { padding:0; border:0; border-bottom:1px solid var(--muted); background:transparent; color:var(--muted); cursor:pointer; font-size:11px; } .quantity { display:flex; align-items:center; gap:14px; font-size:13px; } .cart-action { width:25px; height:25px; border:1px solid var(--line); border-radius:50%; background:transparent; cursor:pointer; } .cart-action:hover { background:var(--ink); color:var(--paper); } .cart-item > strong { font-size:13px; font-weight:500; text-align:right; }
    .cart-summary { background:var(--cream); padding:26px; } .cart-summary > div { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:18px; font-size:14px; } .cart-summary strong { font-weight:500; } .cart-summary p { color:var(--muted); font-size:12px; line-height:1.6; margin:17px 0 24px; } .cart-button { display:inline-flex; justify-content:space-between; align-items:center; gap:18px; width:100%; padding:15px 17px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; font:inherit; font-size:12px; } .cart-button:hover { background:var(--coral); border-color:var(--coral); } .cart-empty { max-width:500px; padding:50px 0 90px; } .cart-empty h2 { font:500 55px var(--serif); letter-spacing:-.06em; margin:15px 0; } .cart-empty p { color:var(--muted); margin:0 0 30px; font-size:14px; } .cart-empty .cart-button { width:auto; }
    footer { padding:28px 32px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; text-align:center; }
    @media(max-width:750px) { .nav { padding:18px 20px; } .nav-links { gap:14px; font-size:11px; } .cart-shell { padding:56px 20px 75px; } h1 { margin-bottom:38px; } .cart-layout { display:block; } .cart-items-heading { grid-template-columns:1fr 92px; } .cart-items-heading span:nth-child(2) { display:none; } .cart-items-heading span:last-child { text-align:right; } .cart-item { grid-template-columns:70px 1fr 76px; gap:12px; } .cart-item img { width:70px; height:92px; } .cart-item > strong { grid-column:3; grid-row:1; align-self:end; } .quantity { grid-column:2; grid-row:2; } .cart-summary { margin-top:35px; } }
  </style>
</head>
<body>
  <div class="announcement">Complimentary shipping on orders over $150</div>
  <header><nav class="nav"><a class="logo" href="index.html">MAXIMUS<span>.</span></a><div class="nav-links"><a href="men.html">Men</a><a href="women.html">Women</a><a href="kids.html">Kids</a><a href="index.html">Home ↗</a></div></nav></header>
  <main class="cart-shell"><div class="eyebrow">Your selections</div><h1>Your bag</h1><div class="cart-layout" data-cart-page></div></main>
  <footer>© 2024 Maximus Studio. Made thoughtfully.</footer>
  <script src="cart.js"></script>
</body>
</html>
